<!doctype html>
<!--
  Two prices inside one container, separated by nothing but whitespace. If the
  number pattern allowed whitespace these would fuse into "89.99129.99"; they must
  stay two numbers. With one vote each, the earlier one wins the tie — which is
  also the correct reading, since stores put the price you pay first.

  Correct answer: 89.99, and emphatically not a five-figure number.
-->
<html lang="en">
  <head>
    <title>Merino Base Layer — Trail Outfitters</title>
  </head>
  <body>
    <h1>Merino Base Layer</h1>
    <div class="product-price">
      <span>$89.99</span>
      <span>$129.99</span>
    </div>
    <p>In stock</p>
  </body>
</html>
