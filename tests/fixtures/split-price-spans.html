<!doctype html>
<!--
  A French store: the price is split across elements AND uses a no-break space as
  the thousands separator. Correct answer: 1299.90 EUR.
-->
<html lang="fr">
  <head>
    <title>Vélo de route Carbone — Cycles Durand</title>
    <meta property="og:title" content="Vélo de route Carbone" />
  </head>
  <body>
    <h1>Vélo de route Carbone</h1>
    <div class="product-price">
      <span class="price-whole">1&nbsp;299</span><span class="price-sep">,</span
      ><span class="price-cents">90</span>
      <span class="price-symbol">€</span>
    </div>
    <p>En stock — in stock</p>
  </body>
</html>
