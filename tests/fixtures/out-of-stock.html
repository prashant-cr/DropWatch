<!doctype html>
<html lang="en">
  <head>
    <title>Console Bundle — Holiday Edition</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Console Bundle — Holiday Edition",
        "offers": {
          "@type": "Offer",
          "price": 499.99,
          "priceCurrency": "USD",
          "availability": "https://schema.org/OutOfStock"
        }
      }
    </script>
  </head>
  <body>
    <h1>Console Bundle — Holiday Edition</h1>
    <span class="price">$499.99</span>
    <!-- The disabled cart button is still in the markup, so "out of stock" must win. -->
    <button disabled>Add to cart</button>
    <p>Currently unavailable</p>
  </body>
</html>
