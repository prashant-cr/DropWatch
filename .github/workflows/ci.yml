name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      # One Node version failing should not hide the result on the others.
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The unit tests never launch a browser, so skip the ~150 MB download.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Style and types cannot differ per runtime; checking them once is enough.
      - name: Lint
        if: matrix.node == 20
        run: npm run lint

      - name: Typecheck
        if: matrix.node == 20
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Packaged CLI starts
    runs-on: ubuntu-latest
    needs: check

    # Installs the tarball exactly as `npx dropwatch` would and boots it. This is
    # the only check that exercises what users actually receive: a wrong `files`
    # entry, a missing schema.sql or a broken `bin` mapping all pass every other
    # job in this workflow and fail here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm run build

      - name: Build the tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install it into a clean project
        working-directory: ${{ runner.temp }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          mkdir -p smoke
          cd smoke
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/dropwatch-*.tgz

      - name: The CLI responds
        working-directory: ${{ runner.temp }}/smoke
        run: |
          npx dropwatch --help | grep -q 'self-hosted price'
          test "$(npx dropwatch --version)" = "$(node -p "require('./node_modules/dropwatch/package.json').version")"

      - name: The server boots and serves the UI
        working-directory: ${{ runner.temp }}/smoke
        run: |
          # --skip-browser-check because Chromium was deliberately not downloaded;
          # nothing here runs a check, it only proves the server comes up.
          npx dropwatch --skip-browser-check --port 3999 > server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true; echo "--- server log ---"; cat server.log' EXIT

          curl -sf --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:3999/api/health -o health.json
          cat health.json
          grep -q '"ok":true' health.json

          # /api/health reports the version from package.json, so a stale build or a
          # half-applied bump shows up here.
          grep -q "\"version\":\"$(node -p "require('./node_modules/dropwatch/package.json').version")\"" health.json

          # The built UI must be inside the tarball too, not just the API.
          curl -sf http://127.0.0.1:3999/ | grep -qi '<title>DropWatch'

          # The database is created private to the owner; the SMTP password lives there.
          test "$(stat -c '%a' data/dropwatch.db)" = "600"
